<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="View your shopping cart at RainyDays">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rainy Days | Cart</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <!-- Content for women's clothing page -->
    <header>
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="RainyDays logo">
        </a>

    <div class="icons">
        <a href="#">head</a>
        <a href="#">heart</a>
        <a href="cart.html">cart</a>
    </div>

    <form class="search-form">
        <label for="cart-search" class="visually-hidden">Search</label>
        <input type="search" id="cart-search" name="search" placeholder="Search">
    </form>
</header>
    
<main>
<section class="cart-page">
    <section class="breadcrumb">
        <p>Homepage > Woman > All Jackets > The Rover Jacket > Shopping Cart</p>
    </section>

        <h1>Shopping Cart</h1>

    <div class="cart-layout">
        <div class="cart-items">
            <article class="cart-item".>
            <img src="images/roverjacket1.jpg" alt="The Rover Jacket">
        
            <div class="cart-item-info">
                <h2>The Rover Jacket</h2>

                <p>Colour: Red/Beige</p>
                <p>Size: M</p>

                <p class="stock-status">✓ In stock</p>

                <div class="quantity-control">
                    <button>-</button>
                    <button>1</button>
                    <button>+</button>
                </div>

                <p class="cart-price">$159.00</p>

                <button class="remove-buttom">Remove</button>
            </div>
        </article>
    </div>
    <aside class="cart-summary">
        <h2>Order Summary</h2>
        <div class="summary-line">
            <span>Subtotal</span>
            <span>$159.00</span>
        </div>

        <div class="summary-line">
            <span>Shipping</span>
            <span>Free</span>
        </div>
        
        <div class="summary-total">
            <span>Total</span>
            <span>$159.00</span>
        </div>

        <a href="checkout.html" class="checkout-button">
            Proceed to Checkout
        </a>
    </aside>
    </div>
</section>
</main>
<footer>

</footer>
</body>

</html>
